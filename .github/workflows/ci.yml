name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Chromium only (the Playwright config defines a single chromium project).
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      # Serves the repo root via `python3 -m http.server` (preinstalled on the
      # runner) and drives the existing in-browser test pages.
      - name: Run headless test suite
        run: npm test

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
